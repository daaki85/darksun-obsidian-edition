# Publishes a release: the tests, then a zip of the obsidian-edition folder with the notes in
# release-notes/<tag>.md, and the patch notes' web page (patch-notes.html, made at the repository's
# root) beside the zip as an asset of its own. The zip is that folder as git archive makes it: what
# obsidian-edition/.gitattributes marks export-ignore (the developer pages DEVELOPMENT*.md, tests/,
# docs/viewer.png) stays out, and its copy of the patch notes is the manual's changes.html. Either a
# version tag (v1.0.0, ...) is pushed, or the workflow is run by hand (Actions -> Release -> Run
# workflow) on main: then the tag is "v" and dsloader's __version__, made on the commit it runs on.
#
# DOSBox-X comes with it for Windows (dsloader/dosboxx.py: the engine whenever one is found): the
# 64-bit Windows build of DOSBOX_X_VERSION, unchanged, from DOSBox-X's own release, is put in the
# zip's dosbox-x folder with its licence (COPYING.txt, GPL 2) and SOURCE.txt, which says where its
# source is; that source, DOSBox-X's own archive of the same tag, goes beside the zip as an asset,
# so it is offered from the same place as the program (GPL 2, section 3). DOSBOX_X_SHA256, when
# set, is checked against the download (each run prints what it got).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOSBOX_X_VERSION: "2026.10.01"
  DOSBOX_X_SHA256: ""

jobs:
  release:
    # (run by hand: only on main, as the note above says)
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: The emulator for DSCLOG's tests
        run: python -m pip install unicorn==2.1.4
      - name: nasm, for the DOS programs' rebuild checks (DSCLOG.EXE, GAMEEND.COM, UMBPLUS.COM)
        # (2.16.01, the version DSCLOG.EXE is built with: nasm 3 encodes it otherwise, so the rebuild
        # checks failed and the tests read the wrong symbols, 2026-11-10)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/2.16.01/win64/nasm-2.16.01-win64.zip" -OutFile "$env:RUNNER_TEMP\nasm.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\nasm.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\nasm-2.16.01"
      - name: Tests
        working-directory: obsidian-edition
        env:
          DSUN_REQUIRE_NASM: "1"
        run: python -m unittest discover -s tests
      - name: The version (and the tag, when one was pushed)
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'obsidian-edition'); import dsloader; print(dsloader.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "dsloader.__version__ is $version, the tag $GITHUB_REF_NAME"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          test -f "release-notes/v$version.md" || { echo "no release-notes/v$version.md"; exit 1; }
      - name: Zip
        shell: bash
        run: |
          git archive --format=zip --prefix="Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION/" -o "Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION.zip" "$GITHUB_SHA":obsidian-edition
      - name: DOSBox-X for Windows, its licence and its source
        shell: bash
        run: |
          base="https://github.com/joncampbell123/dosbox-x"
          tag="dosbox-x-v$DOSBOX_X_VERSION"
          curl -fsSL -o dbx.zip "$base/releases/download/$tag/dosbox-x-vsbuild-win64-$DOSBOX_X_VERSION-portable.zip"
          curl -fsSL -o "dosbox-x-source-$DOSBOX_X_VERSION.tar.gz" "$base/archive/refs/tags/$tag.tar.gz"
          got=$(sha256sum dbx.zip | cut -d' ' -f1)
          echo "DOSBox-X $DOSBOX_X_VERSION for Windows: sha256 $got"
          if [ -n "$DOSBOX_X_SHA256" ] && [ "$got" != "$DOSBOX_X_SHA256" ]; then
            echo "expected $DOSBOX_X_SHA256"; exit 1
          fi
          python - "Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION" <<'PY'
          import os, sys, zipfile
          top, v = sys.argv[1], os.environ["DOSBOX_X_VERSION"]
          tag = "dosbox-x-v" + v
          take = {"bin/x64/Release SDL2/dosbox-x.exe": "dosbox-x.exe", "COPYING": "COPYING.txt",
                  "bin/x64/Release SDL2/README.txt": "README.txt"}
          source = (f"DOSBox-X {v}, the 64-bit Windows build (dosbox-x.exe), as DOSBox-X's own release gives it,\r\n"
                    f"unchanged. DOSBox-X is free software under the GNU General Public License, version 2\r\n"
                    f"(COPYING.txt). Its source code for this version:\r\n\r\n"
                    f"  https://github.com/joncampbell123/dosbox-x/tree/{tag}\r\n\r\n"
                    f"and a copy of it beside this mod's download (dosbox-x-source-{v}.tar.gz on the same release\r\n"
                    f"page). DOSBox-X's site: https://dosbox-x.com/\r\n\r\n"
                    f"The Obsidian Edition's Loader starts it with its own configuration (obsidian.conf, written\r\n"
                    f"here at each start). To play in GOG's DOSBox instead, choose it on the Loader's Options tab\r\n"
                    f"(Engine).\r\n")
          with zipfile.ZipFile("dbx.zip") as src, zipfile.ZipFile(top + ".zip", "a", zipfile.ZIP_DEFLATED) as out:
              names = set(src.namelist())
              for name, to in take.items():
                  if name not in names:
                      sys.exit(f"DOSBox-X's zip has no {name}")
                  out.writestr(f"{top}/dosbox-x/{to}", src.read(name))
              out.writestr(f"{top}/dosbox-x/SOURCE.txt", source)
          PY
          echo "DBX_SOURCE=dosbox-x-source-$DOSBOX_X_VERSION.tar.gz" >> "$GITHUB_ENV"
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION.zip" patch-notes.html "$DBX_SOURCE" --target "$GITHUB_SHA" \
            --title "Dark Sun: Shattered Lands - Obsidian Edition $VERSION" --notes-file "release-notes/v$VERSION.md"
