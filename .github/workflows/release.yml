# Publishes a release: the tests, then a zip of the obsidian-edition folder (and the patch notes'
# web page, patch-notes.html, in it and beside it) with the notes in release-notes/<tag>.md. Either a version tag (v1.0.0, ...) is pushed, or the workflow is run by
# hand (Actions -> Release -> Run workflow) on main: then the tag is "v" and dsloader's
# __version__, made on the commit it runs on.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # (run by hand: only on main, as the note above says)
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: The emulator for DSCLOG's tests
        run: python -m pip install unicorn==2.1.4
      - name: nasm, for the DOS programs' rebuild checks (DSCLOG.EXE, GAMEEND.COM, UMBPLUS.COM)
        # (2.16.01, the version DSCLOG.EXE is built with: nasm 3 encodes it otherwise, so the rebuild
        # checks failed and the tests read the wrong symbols, 2026-11-10)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/2.16.01/win64/nasm-2.16.01-win64.zip" -OutFile "$env:RUNNER_TEMP\nasm.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\nasm.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\nasm-2.16.01"
      - name: Tests
        working-directory: obsidian-edition
        env:
          DSUN_REQUIRE_NASM: "1"
        run: python -m unittest discover -s tests
      - name: The version (and the tag, when one was pushed)
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'obsidian-edition'); import dsloader; print(dsloader.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "dsloader.__version__ is $version, the tag $GITHUB_REF_NAME"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          test -f "release-notes/v$version.md" || { echo "no release-notes/v$version.md"; exit 1; }
      - name: Zip
        shell: bash
        run: |
          git archive --format=zip --prefix="Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION/" -o "Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION.zip" "$GITHUB_SHA":obsidian-edition
          # (the patch notes' web page is made at the repository's root, beside PATCH-NOTES.md: added
          # to the zip's folder too, next to player-guide.html; its links are all web addresses)
          python .github/add_to_zip.py "Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION.zip" \
            "Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION/patch-notes.html" patch-notes.html
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "Dark-Sun-Shattered-Lands-Obsidian-Edition-$VERSION.zip" patch-notes.html --target "$GITHUB_SHA" \
            --title "Dark Sun: Shattered Lands - Obsidian Edition $VERSION" --notes-file "release-notes/v$VERSION.md"
